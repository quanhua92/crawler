use_default_settings: true

server:
  bind_address: "0.0.0.0"
  port: 8080
  secret_key: "crawler-searxng-dev-key-change-me"
  limiter: false

search:
  formats:
    - html
    - json

outgoing:
  request_timeout: 10
  useragent_suffix: "crawler/0.1"

engines:
  - name: google
    engine: google
    shortcut: g
    disabled: false
  - name: bing
    engine: bing
    shortcut: b
    disabled: false
  - name: duckduckgo
    engine: duckduckgo
    shortcut: ddg
    disabled: false
  - name: wikipedia
    engine: wikipedia
    shortcut: wp
    disabled: false
  - name: github
    engine: github
    shortcut: gh
    disabled: false
